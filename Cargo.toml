[package]
name = "faststats-rs"
version = "0.1.0"
edition = "2024"
description = "A Rust SDK for FastStats: metrics submission, error/panic tracking, and feature flags."
license = "CC BY-SA 4.0"
repository = "https://github.com/iseal56/faststats-rs"

[dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json", "gzip", "rustls"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
regex = "1"
flate2 = "1"
log = "0.4"
crossterm = { version = "0.29.0", optional = true }
#pumpkin-plugin-api = { version = "0.1.0", git = "https://github.com/Pumpkin-MC/Pumpkin", optional = true }
os_info = "3.15"

[dev-dependencies]
wiremock = "0.6"

[features]
default = []
terminal = ["dep:crossterm"]
#pumpkinmc = ["dep:pumpkin-plugin-api"]
