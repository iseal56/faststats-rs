[package]
name = "faststats-rs"
version = "0.1.2"
edition = "2024"
description = "A Rust SDK for FastStats: metrics submission, error/panic tracking, and feature flags."
license-file = "LICENCE"
repository = "https://github.com/iseal56/faststats-rs"

[dependencies]
ureq = { version = "2.9.1", optional = true }
reqwest = { version = "0.13.4", default-features = false, optional = true, features = ["json", "gzip", "rustls"] }
tokio = { version = "1", optional = true, features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5.0"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
regex = "1"
flate2 = "1"
log = "0.4"
crossterm = { version = "0.29.0", optional = true }
pumpkin-plugin-api = { version = "0.2.0", optional = true }
os_info = "3.15"

[dev-dependencies]
wiremock = "0.6"

[features]
default = ["use_tokio"]
use_tokio = ["dep:tokio", "dep:reqwest"]
terminal = ["dep:crossterm"]
pumpkinmc = ["dep:pumpkin-plugin-api", "dep:ureq"]
